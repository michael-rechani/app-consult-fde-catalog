name: Validate catalog

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run offline regression tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v
      - name: Check entries, generated indexes and local links
        run: python .github/scripts/validate_catalog.py
